name: CI

# Tests PanesCore and builds the app on every push to main and every pull request. The release
# workflow tests again before it signs anything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 26 and its Xcode: the app uses the Liquid Glass APIs and Swift 6.2.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: swift test

      - name: Build app
        run: swift build -c release --arch arm64
